name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyless: auto uses the job's built-in GITHUB_TOKEN, and npmjs.org auth is OIDC trusted publishing — no stored secrets.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # auto publishes via `lerna publish`; lerna >= 10 exchanges this for a short-lived npm token

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pin 24.18.0+: Node 24.17.0 carries an http.Agent regression that makes node-fetch@2 (auto's pinned
          # octokit) throw false ERR_STREAM_PREMATURE_CLOSE on keep-alive socket reuse — nodejs/node#63989, fixed in 24.18.0.
          node-version: 24.18.0
          cache: 'pnpm'

      # allow the lock file to change (updating our own workspace versions in monorepo)
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # commit back the lock file change if it works
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply pnpm-lock.yaml changes

      - run: pnpm release
